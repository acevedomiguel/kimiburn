name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kimiburn-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:release-notes
      - name: Verify application
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted files:\n%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
          go test -race ./...
          go build ./cmd/kimiburn
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      - name: Validate release configuration
        run: |
          goreleaser check
          goreleaser release --snapshot --clean
          git diff --exit-code
      - name: Determine version and publish release
        id: semantic
        run: ./node_modules/.bin/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: kimiburn-release-bot
          GIT_AUTHOR_EMAIL: kimiburn-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: kimiburn-release-bot
          GIT_COMMITTER_EMAIL: kimiburn-release-bot@users.noreply.github.com
      - name: Job summary
        if: always()
        env:
          VERSION: ${{ steps.semantic.outputs.version }}
        run: |
          {
            echo '### Kimiburn release'
            if [ -n "$VERSION" ]; then
              echo "Published version: v$VERSION"
              echo "Release page: https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
            else
              echo 'No qualifying commits since the last release; nothing published.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verify-archives:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Download and verify a published archive
        shell: bash
        run: |
          set -eu
          case "$RUNNER_OS" in
            Linux) asset="kimiburn_${VERSION}_linux_amd64.tar.gz" ;;
            Windows) asset="kimiburn_${VERSION}_windows_amd64.zip" ;;
          esac
          url="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${asset}"
          curl -fsSL -o "$asset" "$url"
          mkdir -p unpacked
          if [ "$RUNNER_OS" = 'Windows' ]; then
            unzip -q "$asset" -d unpacked
            ./unpacked/kimiburn.exe --version | grep -q "kimiburn version ${VERSION}"
          else
            tar -xzf "$asset" -C unpacked
            ./unpacked/kimiburn --version | grep -q "kimiburn version ${VERSION}"
          fi
