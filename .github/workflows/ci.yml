name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [modfile, stable]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go from go.mod
        if: matrix.go == 'modfile'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up current stable Go
        if: matrix.go == 'stable'
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Format check
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/kimiburn

  goreleaser-snapshot:
    name: goreleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - name: Build snapshot
        uses: goreleaser/goreleaser-action@v7
        env:
          # Defined-but-empty so the tap template resolves; the tap upload is
          # skipped when no tap token is configured.
          HOMEBREW_TAP_TOKEN: ""
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Verify tidy and injected version
        run: |
          git diff --exit-code
          ./dist/kimiburn_linux_amd64_v1/kimiburn --version | grep -q 'kimiburn version'

  secrets:
    name: no committed credentials or private state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject credential-looking files and high-entropy assignments
        shell: bash
        run: |
          set -eu
          if git ls-files | grep -E '(^|/)(token|token\.json|management-token|api-key|\.netrc|credentials\.json|state\.json|probe-[^/]*\.json)$'; then
            echo 'Credential, cache, or probe files must never be committed.'
            exit 1
          fi
          if git grep -nIE '(Bearer[[:space:]]+[A-Za-z0-9._-]{20,}|KIMIBURN_TOKEN=[A-Za-z0-9._-]{20,}|sk-[A-Za-z0-9_-]{20,})' -- . ':!*.md' ':!package-lock.json'; then
            echo 'A credential-looking value appears to be committed.'
            exit 1
          fi

  release-tooling:
    name: release tooling renders notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:release-notes
